name: Skills Sync

on:
  schedule:
    # Every Monday 04:17 UTC
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync upstream skills
        run: pnpm sync:skills

      - name: Validate skills
        run: pnpm validate:skills

      - name: Open or update PR with sync diff
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(skills): sync upstream"
          title: "chore(skills): sync upstream"
          body: |
            Automated weekly sync of upstream-mirrored skills.

            See `internal/skills-maintenance/sync.config.json` for the locked SHAs and `skills/<name>/GENERATION.md` for the source of each entry.
          branch: chore/skills-sync
          delete-branch: true
          add-paths: |
            skills/**
            internal/skills-maintenance/sync.config.json
